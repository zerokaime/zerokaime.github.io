  </header>

  <footer><span id="verstamp">0回目 v0.142</span> ｜ 場面1「歩道で」・場面2「会場の受付・案内」（第一部・第二部）・場面3「職場」<br>あなたの選択は、どこにも送信されません。<br>作者・出どころ・くわしい説明は <a href="https://github.com/zerokaime/zerokaime.github.io#readme" target="_blank" rel="noopener" style="color:var(--blue-deep);text-decoration:underline;text-underline-offset:3px">README（GitHub）</a> に。作り方の経緯と補足は <a href="https://double-techou.hatenablog.com/entry/zerokaime" target="_blank" rel="noopener" style="color:var(--blue-deep);text-decoration:underline;text-underline-offset:3px">ブログの記事</a> に。</footer>

<script>
"use strict";

let playCount = 0;
let S = {};

const ITEMS = [
  {name:"スマホ", counter:"スマホ"},
  {name:"手帳", counter:"手帳"},
  {name:"ボールペン", counter:"ペン"},
  {name:"一枚の紙", counter:"紙"}
];

let approachCount = 0;

function newRun(){
  playCount++;
  S = {
    item: ITEMS[Math.floor(Math.random()*ITEMS.length)],
    world: null,
    lost: false
  };
}

const B1W = [["drop",40],["dansa",25],["door",15],["taka",10],["phone",10]];
let lastWorld = null;
const B1FIRST = [["drop","dansa","door"],["drop","door","dansa"],["dansa","drop","door"],["dansa","door","drop"],["door","drop","dansa"],["door","dansa","drop"]];
let b1Order = null;
function b1Pre(k){ return k === "taka" ? 3 : (k === "phone" ? 4 : 0); }
function b1World(r, exclude){
  const ws = B1W.filter(function(w){ return w[0] !== exclude; });
  const total = ws.reduce(function(a, w){ return a + w[1]; }, 0);
  let acc = 0;
  for(const w of ws){ acc += w[1]; if(r * total < acc) return w[0]; }
  return ws[ws.length - 1][0];
}
function decideWorld(){
  if(approachCount === 0){ lastWorld = null; b1Order = B1FIRST[Math.floor(Math.random() * B1FIRST.length)]; }
  approachCount++;
  let world;
  if(approachCount <= 3) world = (b1Order || B1FIRST[0])[approachCount - 1];
  else if(approachCount === 4) world = "taka";
  else if(approachCount === 5) world = "phone";
  else { world = b1World(Math.random(), null); if(world === lastWorld) world = b1World(Math.random(), lastWorld); }
  lastWorld = world; S.world = world;
  S.lost = (approachCount <= 5) ? true : (Math.random() < 0.5);
}

const stage = document.getElementById("stage");

const SPL = "<!--SPLIT-->";
let splitOff = false, pendingSecond = null;
function headOf(a){
  const s = a.indexOf('<div class="scenebox">'); if(s < 0) return "";
  const re = /<div\b|<\/div>/g; re.lastIndex = s; let depth = 0, m;
  while((m = re.exec(a))){ if(m[0] === "</div>"){ depth--; if(depth === 0) return a.slice(s, m.index + 6); } else depth++; }
  return "";
}
function render(html){
  if(!splitOff && html.indexOf(SPL) >= 0){
    const i = html.indexOf(SPL);
    const a = html.slice(0, i), b = html.slice(i + SPL.length);
    pendingSecond = headOf(a) + b;
    renderRaw(a + '<button class="next" onclick="renderSecond()">次へ</button>');
    return;
  }
  pendingSecond = null;
  renderRaw(html);
}
function renderSecond(){ if(pendingSecond){ const h = pendingSecond; pendingSecond = null; const keep = infoOpen; renderRaw(h); infoOpen = keep; } }
function renderRaw(html){
  infoOpen = false;
  ttsStop();
  stage.innerHTML = html;
  { let run = []; const flush = function(){ if(run.length){ const c = document.createElement("div"); c.className = "card narrbox"; run[0].parentNode.insertBefore(c, run[0]); run.forEach(function(p){ c.appendChild(p); }); run = []; } };
    Array.from(stage.children).forEach(function(el){ if(el.matches("p.narr")) run.push(el); else flush(); }); flush(); }
  const kids = Array.from(stage.children);
  let i = kids.length - 1;
  const grab = [];
  if(!stage.querySelector(".hero")){ while(i >= 0 && kids[i].tagName === "BUTTON"){ grab.unshift(kids[i]); i--; } }
  if(grab.length){
    const dock = document.createElement("div");
    dock.className = "dock";
    grab.forEach(b => dock.appendChild(b));
    stage.appendChild(dock);
  }
  Array.from(stage.children).forEach(function(el, i){ el.style.setProperty("animation-delay", (Math.min(i, 10) * 70) + "ms"); });
  window.scrollTo({top:0, behavior:"auto"});
  const f = stage.querySelector("h1,h2,.card,.learn") || stage.firstElementChild;
  if(f){ f.setAttribute("tabindex","-1"); f.focus({preventScroll:true}); }
  if(ttsAuto && TTS_SUPPORTED){ ttsTimer = setTimeout(function(){ ttsTimer = null; if(ttsAuto) ttsStart(); }, TTS_AUTO_DELAY_MS); }
}

function learn(title, body){
  return `<div class="learn">
    <div class="learnhead"><span class="t">${title}</span></div>
    ${body}
  </div>`;
}

function say(line){
  return `<div class="say"><div class="who">車椅子の男性</div><div class="line">${line}</div></div>`;
}

const FIG160 = `
<div class="fig" role="img" aria-label="車椅子からの視野と立ち位置の図。腰の高さから前方およそ160度だけが見えており、そのうしろは見えない。近づくなら、やや斜め前（左右どちらでも）がいちばん良い。真後ろの至近距離は、車椅子が動くと危ない。">
<svg width="240" height="160" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg">
  <path d="M120 120 L18 74 A110 110 0 0 1 222 74 Z" fill="#E3ECF6" stroke="#1F5FA8" stroke-width="2"/>
  <circle cx="120" cy="120" r="7" fill="#1F5FA8"/>
  <circle cx="78" cy="76" r="7" fill="none" stroke="#1F5FA8" stroke-width="2.5"/>
  <circle cx="162" cy="76" r="7" fill="none" stroke="#1F5FA8" stroke-width="2.5"/>
  <text x="120" y="53" text-anchor="middle" font-size="11" fill="#164A85" font-family="sans-serif">◎ やや斜め前が、いちばん</text>

const TTS_PAUSE_MS = 600;
function ttsApplyDict(t){
  for(const pair of TTS_DICT){ t = t.split(pair[0]).join(pair[1]); }
  t = t.replace(/S(\d)' /g, "エス$1ダッシュ。 ");
  t = t.replace(/S(\d) /g, "エス$1。 ");
  t = t.replace(/S(\d)'/g, "エス$1ダッシュ");
  t = t.replace(/S(\d)/g, "エス$1");
  const WK = ["", "いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう"];
  t = t.replace(/W(\d)' /g, function(_, d){ return "ダブリュー" + WK[+d] + "ダッシュ。 "; });
  t = t.replace(/W(\d) /g, function(_, d){ return "ダブリュー" + WK[+d] + "。 "; });
  t = t.replace(/W(\d)'/g, function(_, d){ return "ダブリュー" + WK[+d] + "ダッシュ"; });
  t = t.replace(/W(\d)/g, function(_, d){ return "ダブリュー" + WK[+d]; });
  t = t.split("」と").join("」、と");
  t = t.replace(/(^|[。 ])は？/g, "$1ハ？");
  return t;
}

function ttsPickVoice(){
  if(!TTS_SUPPORTED) return;
  const ja = speechSynthesis.getVoices().filter(function(v){ return (v.lang || "").toLowerCase().indexOf("ja") === 0; });
  ttsVoice = ja.find(function(v){ return /google/i.test(v.name); }) || ja[0] || null;
}

function ttsParts(marks, root){
  const clone = (root || stage).cloneNode(true);
  if(root){ Array.from(clone.children).forEach(function(c){ if(c.tagName === "SUMMARY") c.remove(); }); }
  clone.querySelectorAll("details.fold:not([open])").forEach(function(d){
    const s = d.querySelector("summary"); const p = document.createElement("p"); p.className = "narr";
    p.textContent = s ? (marks ? "折りたたみ、" : "") + s.textContent.trim() : ""; d.parentNode.replaceChild(p, d);
  });
  clone.querySelectorAll('[role="img"]').forEach(function(el){
    const p = document.createElement("p");
    p.className = "narr";
    p.textContent = "図の説明。" + (el.getAttribute("aria-label") || "");
    el.parentNode.replaceChild(p, el);
  });
  clone.querySelectorAll("br").forEach(function(b){ const prev = ((b.previousSibling && b.previousSibling.textContent) || "").trim(); b.parentNode.replaceChild(document.createTextNode(/[。！？]$/.test(prev) ? " " : "。 "), b); });
  const parts = [];
  const els = Array.from(clone.querySelectorAll(".eyebrow,h1,h2,.sub,.sn,.meta,.narr,.say .who,.say .line,.qlabel,.learnhead .t,.learn p,.grad,.about p,.card p,details.fold summary,details.fold p,button"));
  const elSet = new Set(els);
  let choiceNo = 0;
  els.forEach(function(el){
    if(el.parentElement && elSet.has(el.parentElement)) return;
    let t = el.textContent.replace(/\s+/g, " ").trim();
    if(!t) return;
    if(marks && el.tagName === "BUTTON") t = (el.classList.contains("choice") ? "選択肢" + (++choiceNo) + "、" : "ボタン、") + t;
    parts.push(t);
  });
  if(!parts.length) parts.push(clone.textContent.replace(/\s+/g, " ").trim());
  return parts;
}

function ttsText(root){
  return ttsParts(true, root).join("。 ").replace(/。{2,}/g, "。");
}

const TTS_READABLE = /[0-9A-Za-z０-９Ａ-Ｚａ-ｚぁ-ゖァ-ヺー一-鿿々〆]/;
function ttsChunks(text){
  const out = [];
  let buf = "";
  const push = function(s){ s = s.trim(); if(s && TTS_READABLE.test(s)) out.push(s); };
  for(const ch of text){
    if(ch === "—"){
      push(buf);
      if(out[out.length - 1] !== "\u0000") out.push("\u0000");
      buf = "";
      continue;
    }
    buf += ch;
    if(ch === "。" || ch === "！" || ch === "？"){
      push(buf);
      buf = "";
    } else if(buf.length >= 90){
      const cut = buf.lastIndexOf("、");
      if(cut > 30){ push(buf.slice(0, cut + 1)); buf = buf.slice(cut + 1); }
      else { push(buf); buf = ""; }
    }
  }
  push(buf);
  return out;
}

function ttsSetOn(on){
  ttsOn = on;
  const b = document.getElementById("ttsbtn");
  if(!b) return;
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.textContent = on ? "⏹ 停止" : "🔊 読み上げ";
  b.setAttribute("aria-label", on ? "読み上げを停止する" : "この画面を読み上げる");
}

function ttsSpeakNext(){
  if(!ttsOn || ttsIdx >= ttsList.length){ ttsSetOn(false); return; }
  const piece = ttsList[ttsIdx++];
  if(piece === "\u0000"){ ttsTimer = setTimeout(ttsSpeakNext, TTS_PAUSE_MS); return; }
  const u = new SpeechSynthesisUtterance(piece);
  u.lang = "ja-JP";
  if(ttsVoice) u.voice = ttsVoice;
  u.rate = 1;
  const g = ttsGen;
  u.onend = function(){ if(g === ttsGen) ttsSpeakNext(); };
  u.onerror = function(){ if(g === ttsGen) ttsSetOn(false); };
  ttsUtter = u;
  speechSynthesis.speak(u);
}

function ttsStart(root){
  if(!TTS_SUPPORTED) return;
  if(ttsTimer){ clearTimeout(ttsTimer); ttsTimer = null; }
  ttsGen++;
  ttsRoot = root || null;
  ttsList = ttsChunks(ttsApplyDict(ttsText(root)));
  ttsIdx = 0;
  if(!ttsList.length) return;
  const busy = speechSynthesis.speaking || speechSynthesis.pending;
  if(busy) speechSynthesis.cancel();
  ttsSetOn(true);
  if(busy) ttsTimer = setTimeout(ttsSpeakNext, 60); else ttsSpeakNext();
}

function ttsStop(){
  if(!TTS_SUPPORTED){ return; }
  if(ttsTimer){ clearTimeout(ttsTimer); ttsTimer = null; }
  ttsGen++;
  ttsOn = false;
  ttsUtter = null;
  speechSynthesis.cancel();
  ttsSetOn(false);
}

function b3Score(){
  let t = 0;
  for(const k in B3PT){ const c = B3[k]; if(c && B3PT[k][c] !== undefined) t += B3PT[k][c]; }
  return t;
}

function kenshuSpeakLine(t){
  const chunks = ttsChunks(ttsApplyDict(t));
  let ci = 0;
  const g = KQ.gen;
  function nextChunk(){
    if(!KQ || !KQ.playing || g !== KQ.gen) return;
    if(!document.getElementById("kline")){ kenshuHalt(); return; }
    if(ci >= chunks.length){ kenshuNext(); return; }
    const piece = chunks[ci++];
    if(piece === "\u0000"){ KQ.timer = setTimeout(nextChunk, TTS_PAUSE_MS); return; }
    const u = new SpeechSynthesisUtterance(piece);
    u.lang = "ja-JP"; if(ttsVoice) u.voice = ttsVoice; u.rate = KQ.rate;
    u.onend = nextChunk;
    u.onerror = function(){ if(KQ && g === KQ.gen) KQ.playing = false; };
    KQ.utter = u;
    speechSynthesis.speak(u);
  }
  nextChunk();
}

function kenshuHalt(){ if(!KQ) return; KQ.playing = false; KQ.gen++; if(KQ.timer){ clearTimeout(KQ.timer); KQ.timer = null; } }
function kenshuRangeLabel(){
  if(!KQ) return "";
  const last = (KQ.to == null) ? KQ.lines.length - 1 : KQ.to;
  return (KQ.from + 1) + "〜" + (last + 1);
}

function kenshuNext(){
  if(!KQ || !KQ.playing) return;
  if(!document.getElementById("kline")){ kenshuHalt(); return; }
  const last = (KQ.to == null) ? KQ.lines.length - 1 : KQ.to;
  if(KQ.idx < KQ.from - 1) KQ.idx = KQ.from - 1;
  do { KQ.idx++; } while(KQ.idx <= last && KQ.onlyFlagged && !kenshuFlag(KQ.lines[KQ.idx]));
  if(KQ.idx > last){
    KQ.playing = false;
    if(last >= KQ.lines.length - 1) kenshuStatus("終わりです。");
    else kenshuStatus(kenshuRangeLabel() + " は終わりです。");
    return;
  }
  const t = KQ.lines[KQ.idx];
  const line = document.getElementById("kline");
  const prog = document.getElementById("kprog");
  if(line) line.textContent = t;
  if(prog) prog.textContent = (KQ.idx + 1) + " / " + KQ.lines.length + (KQ.to == null ? "" : "（" + kenshuRangeLabel() + "）") + (kenshuFlag(t) ? "　⚑要注意" : "");
  kenshuSpeakLine(t);
}

function kenshuPlay(fromTop){
  if(!KQ) return;
  if(!TTS_SUPPORTED){ kenshuStatus("この環境は読み上げ非対応です。"); return; }
  speechSynthesis.cancel(); kenshuHalt();
  if(fromTop){ KQ.idx = -1; KQ.from = 0; KQ.to = null; }
  KQ.playing = true;
  KQ.timer = setTimeout(kenshuNext, 60);
}

function kenshuPlayBlock(from, to){
  if(!KQ) return;
  if(!TTS_SUPPORTED){ kenshuStatus("この環境は読み上げ非対応です。"); return; }
  speechSynthesis.cancel(); kenshuHalt();
  KQ.from = Math.max(0, from - 1); KQ.to = Math.min(KQ.lines.length, to) - 1; KQ.idx = KQ.from - 1;
  kenshuStatus(kenshuRangeLabel() + " を再生します。");
  KQ.playing = true;
  KQ.timer = setTimeout(kenshuNext, 60);
}

function kenshuPause(){
  if(!KQ) return;
  if(KQ.playing){
    kenshuHalt();
    if(TTS_SUPPORTED) speechSynthesis.cancel();
    kenshuStatus("一時停止中。");
  } else {
    KQ.idx--;
    kenshuStatus("");
    kenshuPlay(false);
  }
}

function kenshuMark(){
  if(!KQ || KQ.idx < 0 || KQ.idx >= KQ.lines.length) return;
  const t = KQ.lines[KQ.idx];
  if(KQ.marks.indexOf(t) === -1) KQ.marks.push(t);
  const ta = document.getElementById("kmarks");
  if(ta) ta.value = KQ.marks.map(function(m, i){ return (i + 1) + ". " + m; }).join("\n");
  kenshuStatus("旗を立てました（" + KQ.marks.length + "件）。");
}

function kenshuRate(r){ if(KQ) KQ.rate = r; kenshuStatus("速さ " + r + " に変更。"); }

function kenshuOnly(btn){
  if(!KQ) return;
  KQ.onlyFlagged = !KQ.onlyFlagged;
  if(btn) btn.textContent = "⚑要注意のみ: " + (KQ.onlyFlagged ? "ON" : "OFF");
}

function kenshuCopy(){

function kenshuStatus(m){

}

function kenshuView(){
  const total = KQ.lines.length;
  let flagged = 0;
  for(const t of KQ.lines){ if(kenshuFlag(t)) flagged++; }
  const b = 'style="width:auto;display:inline-block;min-height:42px;padding:8px 12px;margin:2px 4px 2px 0"';
  const BLK = 100; const blocks = [];
  for(let s = 1; s <= total; s += BLK){ const e = Math.min(s + BLK - 1, total); blocks.push(`<button class="ghost" ${b} onclick="kenshuPlayBlock(${s},${e})">${s}〜${e}</button>`); }
  return `
  <div class="card">
    <p class="eyebrow">検収モード（開発用）</p>
    <p class="sn">全文言 <b>${total}行</b>（うち ⚑要注意 <b>${flagged}行</b>）</p>
    <p>
      <button class="ghost" ${b} onclick="kenshuPlay(true)">▶ 最初から再生</button>
      <button class="ghost" ${b} onclick="kenshuPause()">⏯ 一時停止／再開</button>
      <button class="ghost" ${b} onclick="kenshuMark()">⚠ この行に旗</button>
    </p>
    <p>${blocks.join("")}</p>
    <p>
      <button class="ghost" ${b} onclick="kenshuRate(1.0)">速さ1.0</button>
      <button class="ghost" ${b} onclick="kenshuRate(1.3)">1.3</button>
      <button class="ghost" ${b} onclick="kenshuRate(1.6)">1.6</button>
      <button class="ghost" ${b} onclick="kenshuOnly(this)">⚑要注意のみ: OFF</button>
    </p>
    <p class="sn" id="kprog">未再生</p>
    <p class="narr" id="kline" style="min-height:3em">—</p>
    <p class="sn" id="kstat"></p>
    <p class="sn">疑義リスト:　<button class="ghost" ${b} onclick="kenshuCopy()">リストをコピー</button></p>
    <textarea id="kmarks" readonly style="width:100%;min-height:8em;font-size:.9rem;box-sizing:border-box"></textarea>
  </div>
  <button class="ghost" onclick="kenshuHalt(); ttsStop(); go('home')">ホームに戻る</button>`;
}

function kenshuStart(){
  ttsAuto = false;
  KQ = { lines: kenshuCorpus(), idx: -1, from: 0, to: null, playing: false, rate: 1.0, onlyFlagged: false, marks: [], gen: 0, timer: null, utter: null };
  render(kenshuView());
}

const KENSHU_TAPS = 5;
const KENSHU_TAP_GAP_MS = 3000;
let kenshuTapCount = 0, kenshuTapLast = 0;
(function(){
  const el = document.getElementById("verstamp");
  if(!el) return;
  el.addEventListener("click", function(){
    const now = Date.now();
    kenshuTapCount = (now - kenshuTapLast > KENSHU_TAP_GAP_MS) ? 1 : (kenshuTapCount + 1);
    kenshuTapLast = now;
    if(kenshuTapCount >= KENSHU_TAPS){
      kenshuTapCount = 0;
      kenshuStart();
    }
  });
})();

window.addEventListener("hashchange", function(){ if(location.hash === "#kenshu"){ kenshuStart(); } });
if(location.hash === "#kenshu"){ kenshuStart(); } else { go("genkan"); }

<script>
(function(){
  var SS = (typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined") ? speechSynthesis : null;
  var wrap = document.createElement("div");
  wrap.id = "shirabe";
  wrap.style.cssText = "position:fixed;left:0;right:0;bottom:0;margin:0;padding:0;background:#000;z-index:99999;pointer-events:none;";
  var beepBtn = document.createElement("button");
  beepBtn.type = "button";
  beepBtn.textContent = "先にここを押す → ピー";
  beepBtn.style.cssText = "display:block;width:100%;margin:0;padding:10px 8px;border:0;border-radius:0;background:#fff;color:#000;font:700 15px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;pointer-events:auto;touch-action:manipulation;";
  var box = document.createElement("pre");
  box.setAttribute("aria-hidden", "true");
  box.style.cssText = "margin:0;padding:6px 8px 10px;max-height:50vh;overflow:hidden;background:#000;color:#fff;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;text-align:left;";
  wrap.appendChild(beepBtn);
  wrap.appendChild(box);
  document.body.appendChild(wrap);

  var t0 = Date.now(), rows = [], keep = [], n = 0, bad = 0, errs = 0, streak = 0, vc = 0, vcEmpty = 0, vcNoVoice = 0, trial = "", trialStarted = false, lastCancel = 0, beep = "まだ";
  function sec(ms){ return (ms / 1000).toFixed(2); }
  function ja(){
    if(!SS) return [];
    return SS.getVoices().filter(function(v){ return (v.lang || "").toLowerCase().indexOf("ja") === 0; });
  }
  function isElo(v){ return /eloquence/i.test(v.voiceURI || ""); }
  function workVoice(){
    try { return (typeof ttsVoice !== "undefined" && ttsVoice) ? ttsVoice : null; } catch(e){ return null; }
  }
  function uaShort(){
    var u = navigator.userAgent, a = u.match(/OS (\d+(?:_\d+){0,2})/), b = u.match(/Version\/([\d.]+)/);
    var s = (a ? "OS " + a[1] : "") + (b ? " Safari " + b[1] : "");
    return s || u.slice(0, 60);
  }
  function draw(){
    var lines = [], j = ja(), w = workVoice();
    lines.push("【調べ2】" + uaShort() + "　+" + sec(Date.now() - t0) + "s　ピー: " + beep);
    if(!SS){ lines.push("声の仕組みが無い"); box.textContent = lines.join("\n"); return; }
    lines.push("声 全" + SS.getVoices().length + "・日" + j.length + (j.length ? "：" + j.map(function(v){ return v.name + (isElo(v) ? "*" : ""); }).join("、") : "") + "（変化" + vc + "回・うち空" + vcEmpty + "回）");
    lines.push("作品の声: " + (w ? w.name : "なし") + "（「なし」になった" + vcNoVoice + "回）　読んだ" + n + "・短すぎ" + bad + "・エラー" + errs);
    if(trial) lines.push(trial);
    box.textContent = lines.concat(rows.slice(-8)).join("\n");
  }
  function row(s){ rows.push(s); draw(); return rows.length - 1; }

  window.addEventListener("error", function(e){ row("JS エラー: " + (e && e.message)); });

  beepBtn.addEventListener("click", function(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ beep = "Web Audio が無い"; draw(); return; }
    try {
      var c = new AC(), p0 = Date.now();
      if(c.state !== "running" && c.resume) c.resume();
      var o = c.createOscillator(), g = c.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.value = 0.3;
      o.connect(g);
      g.connect(c.destination);
      o.onended = function(){
        beep = "鳴らし終えた（" + sec(Date.now() - p0) + "s・" + c.state + "）";
        draw();
        try { if(c.close) c.close(); } catch(e){}
      };
      o.start(0);
      o.stop(c.currentTime + 0.8);
      beep = "鳴らしている（" + c.state + "）";
      row("— ピー +" + sec(Date.now() - t0) + "s");
      beepBtn.textContent = "ピーを鳴らした → 次は上の「読み上げ」";
    } catch(err){ beep = "例外 " + err.message; draw(); }
  });

  draw();
  if(!SS) return;

  var origSpeak = SS.speak, origCancel = SS.cancel;

  function startTrial(why){
    if(trialStarted) return;
    trialStarted = true;
    row("— " + why + "。作品の読み上げを止めて、声ごとに試す");
    try { ttsAuto = false; } catch(e){}
    try { if(typeof ttsStop === "function") ttsStop(); } catch(e){}
    var j = ja(), w = workVoice(), cands = [null], res = [], i = 0, begun = Date.now();
    if(w) cands.push(w);
    j.forEach(function(v){ if(v !== w && !isElo(v)) cands.push(v); });
    var firstElo = j.filter(isElo)[0];
    if(firstElo && firstElo !== w) cands.push(firstElo);
    trial = "声ごと: 準備";
    draw();
    function next(){
      if(i >= cands.length || Date.now() - begun > 24000){
        trial = "声ごと: " + res.join(" ") + (i >= cands.length ? "（終わり）" : "（時間切れ）");
        draw();
        return;
      }
      var v = cands[i], name = v ? v.name : "声なし";
      var u = new SpeechSynthesisUtterance("いち、に、さん。");
      u.lang = "ja-JP";
      if(v) u.voice = v;
      u.rate = 1;
      var p0 = Date.now(), st = 0, fin = false;
      var finish = function(mark){
        if(fin) return;
        fin = true;
        res.push(name + mark);
        i++;
        trial = "声ごと: " + res.join(" ");
        draw();
        setTimeout(next, 150);
      };
      u.addEventListener("start", function(){ st = Date.now(); });
      u.addEventListener("end", function(){ var d = Date.now() - (st || p0); finish(sec(d) + (d >= 700 ? "○" : "×")); });
      u.addEventListener("error", function(e){ finish("エラー" + ((e && e.error) ? "(" + e.error + ")" : "")); });
      setTimeout(function(){ finish("無反応"); }, 5000);
      keep.push(u);
      try { origSpeak.call(SS, u); } catch(err){ finish("例外"); }
    }
    setTimeout(next, 350);
  }

  function wrappedSpeak(u){
    var id = ++n, p0 = Date.now(), st = 0, done = false;
    var txt = String((u && u.text) || ""), len = txt.length;
    var label = "#" + id + " " + ((u && u.voice) ? u.voice.name : "声なし") + "「" + txt.slice(0, 9) + (len > 9 ? "…" : "") + "」" + len + "字";
    var idx = row(label + " …");
    var set = function(s){ rows[idx] = label + " " + s; draw(); };
    try {
      u.addEventListener("start", function(){ st = Date.now(); set("開始+" + sec(st - p0)); });
      u.addEventListener("end", function(){
        done = true;
        var d = Date.now() - (st || p0), isBad = len >= 4 && d < Math.max(480, Math.min(len * 45, 1500));
        if(len >= 4){ if(isBad){ bad++; streak++; } else { streak = 0; } }
        set((st ? "開始+" + sec(st - p0) + " " : "開始なし・") + "長さ" + sec(d) + (isBad ? " ←短すぎ" : ""));
        if(streak >= 3) startTrial("短すぎが 3 回続いた");
      });
      u.addEventListener("error", function(e){
        done = true;
        var byCancel = Date.now() - lastCancel < 600;
        if(!byCancel) errs++;
        set("エラー「" + ((e && e.error) || "?") + "」+" + sec(Date.now() - p0) + (byCancel ? "（停止による）" : ""));
        if(!byCancel) setTimeout(function(){ startTrial("エラーが出た"); }, 300);
      });
    } catch(err){ set("（記録を付けられなかった）"); }
    setTimeout(function(){ if(!st && !done) set("1.5s たっても開始なし（speaking=" + SS.speaking + " pending=" + SS.pending + "）"); }, 1500);
    keep.push(u);
    return origSpeak.call(SS, u);
  }
  function wrappedCancel(){
    lastCancel = Date.now();
    return origCancel.call(SS);
  }
  var hooked = false;
  try {
    var proto = Object.getPrototypeOf(SS);
    if(proto && proto !== Object.prototype){
      proto.speak = wrappedSpeak;
      proto.cancel = wrappedCancel;
      hooked = (SS.speak === wrappedSpeak);
    }
  } catch(e){}
  if(!hooked){
    try { SS.speak = wrappedSpeak; SS.cancel = wrappedCancel; hooked = (SS.speak === wrappedSpeak); } catch(e){}
  }
  if(!hooked) row("（記録の差し込みに失敗）");

  var btn = document.getElementById("ttsbtn");
  if(btn){
    btn.addEventListener("click", function(){
      var on = false;
      try { on = !!ttsOn; } catch(e){}
      row("— 読み上げボタン +" + sec(Date.now() - t0) + "s（押す前: " + (on ? "読み上げ中" : "止まっている") + "・作品の声: " + (workVoice() ? workVoice().name : "なし") + "）");
    }, true);
  }
  if(SS.onvoiceschanged !== undefined){
    SS.addEventListener("voiceschanged", function(){
      vc++;
      if(!SS.getVoices().length) vcEmpty++;
      if(!workVoice()) vcNoVoice++;
      draw();
    });
  }
  setTimeout(draw, 500);
  setTimeout(draw, 2000);
})();
</script>
