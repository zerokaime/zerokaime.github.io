<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0回目 — 場面1「歩道で」</title>
<meta name="color-scheme" content="light">
<style>
  :root{
    --paper:#EEF1F3;
    --ink:#22272B;
    --muted:#5A6470;
    --blue:#1F5FA8;
    --blue-deep:#164A85;
    --blue-pale:#E3ECF6;
    --card:#FFFFFF;
    --line:#D7DCE1;
    --amber:#8A5B00;
    --amber-bg:#FBF0D5;
    --radius:14px;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
    --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:16px}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--gothic);
    line-height:1.9;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 64px}
  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:6px 2px 18px;
  }
  .brand{font-family:var(--mincho);font-size:1.05rem;letter-spacing:.35em;color:var(--blue-deep)}
  .brand b{font-size:1.3rem}
  .toplink{background:none;border:none;font-family:var(--gothic);font-size:.8rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px;
    margin:0 0 14px;
    box-shadow:0 2px 10px rgba(34,39,43,.05);
  }
  .narr{font-family:var(--mincho);font-size:1.02rem;line-height:2.1}
  .narr + .narr{margin-top:10px}
  .say{
    border-left:4px solid var(--blue);
    background:var(--blue-pale);
    border-radius:8px;
    padding:14px 16px;
    margin:14px 0 6px;
  }
  .say .who{font-size:.75rem;color:var(--blue-deep);letter-spacing:.15em;margin-bottom:4px}
  .say .line{font-family:var(--mincho);font-size:1.04rem}
  .beat{color:var(--muted);font-family:var(--mincho);text-align:center;padding:10px 0;letter-spacing:.3em}
  .qlabel{font-size:.8rem;color:var(--muted);letter-spacing:.2em;margin:20px 2px 10px}
  button.choice{
    display:block;width:100%;text-align:left;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;margin:0 0 10px;
    font-family:var(--gothic);font-size:.98rem;line-height:1.8;color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  button.choice:hover{border-color:var(--blue)}
  button.choice:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  button.choice .act{display:block;font-size:.78rem;color:var(--muted);margin-bottom:2px;letter-spacing:.08em}
  .learn{
    border:1.5px solid var(--blue);
    border-radius:var(--radius);
    background:var(--card);
    padding:20px;margin:16px 0 14px;
  }
  .learn.kari{border-color:#D9B25E}
  .learnhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .learnhead .t{font-size:.82rem;letter-spacing:.25em;color:var(--blue-deep)}
  .learn.kari .learnhead .t{color:var(--amber)}
  .badge{
    font-size:.7rem;letter-spacing:.1em;
    padding:3px 9px;border-radius:99px;white-space:nowrap;
  }
  .badge.ok{background:var(--blue-pale);color:var(--blue-deep)}
  .badge.kari{background:var(--amber-bg);color:var(--amber)}
  .learn p{font-size:.95rem}
  .learn p + p{margin-top:8px}
  .fig{display:flex;justify-content:center;padding:8px 0 2px}
  button.next{
    display:block;width:100%;
    background:var(--blue);color:#fff;
    border:none;border-radius:var(--radius);
    padding:16px 18px;margin:6px 0 10px;
    font-family:var(--gothic);font-size:1rem;letter-spacing:.1em;
    cursor:pointer;
  }
  button.next:hover{background:var(--blue-deep)}
  button.next:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  button.ghost{
    display:block;width:100%;
    background:none;border:1.5px solid var(--line);border-radius:var(--radius);
    padding:13px 18px;margin:0 0 10px;
    font-family:var(--gothic);font-size:.9rem;color:var(--muted);cursor:pointer;
  }
  button.ghost:hover{border-color:var(--muted)}
  button.ghost:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .hero{
    text-align:center;padding:38px 8px 30px;
  }
  .hero .eyebrow{font-size:.8rem;letter-spacing:.4em;color:var(--muted);margin-bottom:18px}
  .hero h1{
    font-family:var(--mincho);font-weight:600;
    font-size:3.4rem;letter-spacing:.12em;color:var(--blue-deep);
    line-height:1.2;
  }
  .hero .sub{margin-top:20px;font-size:.95rem;color:var(--ink);text-align:left}
  .scenebox{border-top:3px solid var(--blue)}
  .scenebox .sn{font-size:.75rem;letter-spacing:.3em;color:var(--blue-deep);margin-bottom:6px}
  .scenebox h2{font-family:var(--mincho);font-size:1.3rem;font-weight:600;margin-bottom:6px}
  .scenebox .meta{font-size:.82rem;color:var(--muted)}
  .about h2{font-family:var(--mincho);font-size:1.15rem;margin-bottom:10px;color:var(--blue-deep)}
  .about p{font-size:.93rem;margin-bottom:10px}
  .about ul{padding-left:1.2em;font-size:.93rem;margin-bottom:10px}
  .about li{margin-bottom:6px}
  .grad{
    text-align:center;font-family:var(--mincho);
    padding:26px 10px;color:var(--blue-deep);letter-spacing:.15em;font-size:1.05rem;
  }
  footer{
    margin-top:36px;text-align:center;
    font-size:.72rem;color:var(--muted);letter-spacing:.15em;line-height:2;
  }
  .dock{margin-top:2px}
  @media (min-width: 920px){
    html{font-size:15px}
    .wrap{max-width:660px;padding-top:12px}
    .card,.learn{padding:18px 20px}
    .narr{line-height:1.95}
    .hero{padding:26px 8px 20px}
    .dock{position:sticky;bottom:0;padding:14px 0 10px;background:linear-gradient(to top, var(--paper) 72%, rgba(238,241,243,0))}
  }
  @media (prefers-reduced-motion: no-preference){
    .card,.learn,.say{animation:rise .35s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
  /* ---------- α1 読みやすさ層（v0.10・共通CSS層＝以後の全箱に継承） ---------- */
  :root{color-scheme:light}
  header.top{flex-wrap:wrap;gap:2px 8px;align-items:center}
  .toplink{min-height:44px;padding:10px 8px}
  .toplink:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
  button.choice,button.next,button.ghost{min-height:48px}
  .learn.kari{border-color:#A87D1C}
  #ttsbtn[aria-pressed="true"]{color:var(--blue-deep);font-weight:600}
  #verstamp{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  @media (prefers-contrast: more){
    .card{border-width:2px}
    button.choice,button.ghost,.learn{border-width:2.5px}
  }
  @media (max-height:520px){
    .dock{position:static;background:none;padding:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>0</b>回目</div>
    <div>
      <button class="toplink" id="ttsbtn" aria-pressed="false" aria-label="この画面を読み上げる">🔊 読み上げ</button>
      <button class="toplink" id="quitlink" onclick="quitPressed()">終了する</button>
      <button class="toplink" onclick="go('about')">この人物について</button>
    </div>
  </header>
  <main id="stage" aria-live="polite"></main>
  <footer><span id="verstamp">0回目 v0.23</span> ｜ 場面1「歩道で」・場面2「会場の受付」（第一部・第二部）<br>あなたの選択は、どこにも送信されません。</footer>
</div>

<script>
"use strict";

/* ---------- 状態（メモリ内のみ・保存なし） ---------- */
let playCount = 0;
let S = {};

const ITEMS = [
  {name:"スマートフォン", counter:"スマホ"},
  {name:"手帳", counter:"手帳"},
  {name:"ボールペン", counter:"ペン"},
  {name:"一枚の紙", counter:"紙"}
];

let approachCount = 0;

function newRun(){
  playCount++;
  S = {
    item: ITEMS[Math.floor(Math.random()*ITEMS.length)],
    world: null,
    lost: false
  };
}

function decideWorld(){
  approachCount++;
  const r = Math.random();
  S.world = (r < 0.35) ? "drop" : (r < 0.55) ? "dansa" : (r < 0.75) ? "door" : (r < 0.85) ? "taka" : "phone";
  // 序盤保証: 近づいた1〜3回目は必ず「困っている」版。断られ・空振りは4回目以降にしか出ない
  S.lost = (approachCount <= 3) ? true : (Math.random() < 0.5);
}

/* ---------- 部品 ---------- */
const stage = document.getElementById("stage");

function render(html){
  ttsStop();
  stage.innerHTML = html;
  const kids = Array.from(stage.children);
  let i = kids.length - 1;
  const grab = [];
  while(i >= 0 && kids[i].tagName === "BUTTON"){ grab.unshift(kids[i]); i--; }
  if(grab.length){
    const dock = document.createElement("div");
    dock.className = "dock";
    grab.forEach(b => dock.appendChild(b));
    stage.appendChild(dock);
  }
  window.scrollTo({top:0, behavior:"auto"});
  const f = stage.querySelector("h1,h2,.card,.learn");
  if(f){ f.setAttribute("tabindex","-1"); f.focus({preventScroll:true}); }
}

function badge(ok){
  return ok
    ? '<span class="badge ok">監修済</span>'
    : '<span class="badge kari">仮・要検収</span>';
}

function learn(title, body, ok=true){
  return `<div class="learn ${ok?"":"kari"}">
    <div class="learnhead"><span class="t">${title}</span>${badge(ok)}</div>
    ${body}
  </div>`;
}

function say(line){
  return `<div class="say"><div class="who">車椅子の男性</div><div class="line">${line}</div></div>`;
}

const FIG160 = `
<div class="fig" role="img" aria-label="車椅子からの視野と立ち位置の図。腰の高さから前方およそ160度だけが見えており、その後ろは見えない。近づくなら、やや斜め前（左右どちらでも）がいちばん良い。真後ろの至近距離は、車椅子が動くと危ない。">
<svg width="240" height="150" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg">
  <path d="M120 120 L18 74 A110 110 0 0 1 222 74 Z" fill="#E3ECF6" stroke="#1F5FA8" stroke-width="2"/>
  <circle cx="120" cy="120" r="7" fill="#1F5FA8"/>
  <circle cx="78" cy="76" r="7" fill="none" stroke="#1F5FA8" stroke-width="2.5"/>
  <circle cx="162" cy="76" r="7" fill="none" stroke="#1F5FA8" stroke-width="2.5"/>
  <text x="120" y="99" text-anchor="middle" font-size="11" fill="#164A85" font-family="sans-serif">◎ やや斜め前が、いちばん</text>
  <line x1="8" y1="120" x2="232" y2="120" stroke="#D7DCE1" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="120" y="52" text-anchor="middle" font-size="13" fill="#164A85" font-family="sans-serif">前方 約160°</text>
  <text x="120" y="143" text-anchor="middle" font-size="11" fill="#5A6470" font-family="sans-serif">視点の高さ＝立っている人の腰のあたり</text>
  <text x="34" y="112" font-size="11" fill="#5A6470" font-family="sans-serif">ここより後ろは</text>
  <text x="34" y="126" font-size="11" fill="#5A6470" font-family="sans-serif">「存在しない」</text>
  <text x="204" y="112" text-anchor="middle" font-size="11" fill="#8A5B00" font-family="sans-serif">△ 真後ろ至近は</text>
  <text x="204" y="126" text-anchor="middle" font-size="11" fill="#8A5B00" font-family="sans-serif">動くと危ない</text>
</svg>
</div>`;

function helloCard(){
  return learn("「こんにちは」について", `
    <p>挨拶は、<b>コミュニケーションの意図</b>のいちばん簡単な宣言です。それが伝われば、困っている人は続きを話せるし、困っていない人は挨拶を返して、それでおしまい。</p>
    <p>本人いわく——もしかしたら「大丈夫ですか？」より良い言葉かもしれない。</p>
  `, true);
}

/* ---------- 画面 ---------- */
const V = {};

V.home = () => `
  <div class="hero">
    <div class="eyebrow">初対面の、そのまえに。</div>
    <h1>0回目</h1>
    <p class="sub">障害のある人と街で出会う「はじめて」を、失敗しても誰も傷つかない場所で練習する。<br>
    ここでの失敗は、誰のことも傷つけません。何度でもやり直せます。</p>
  </div>
  <div class="card scenebox">
    <div class="sn">場面 1</div>
    <h2>歩道で</h2>
    <div class="meta">所要 2〜3分 ｜ 選択肢式 ｜ 何が起きているかは、歩いてみるまで分かりません</div>
  </div>
  <button class="next" onclick="start()">歩き出す</button>
  <div class="card">
    <p class="eyebrow">場面 2</p>
    <h2>会場の受付・案内（第一部）</h2>
    <p class="sn">所要 3〜4分 ｜ 選択肢式 ｜ 今日のあなたは、この会場の受付・案内スタッフです</p>
  </div>
  <button class="next" onclick="b2Start()">出勤する</button>
  <div class="card">
    <p class="eyebrow">場面 2</p>
    <h2>会場の受付・案内（第二部）</h2>
    <p class="sn">所要 3〜4分 ｜ 今度のあなたは、車椅子の来場者です ｜ 第一部のあとがおすすめ（順番は自由）</p>
  </div>
  <button class="next" onclick="b2p2Start()">開場を待つ</button>
  <button class="ghost" onclick="go('about')">この人物について ／ これは何？</button>
`;

V.exitlite = () => `
  <div class="card">
    <p class="narr">ここで閉じて、大丈夫です。</p>
    <p class="narr">このアプリは何も保存せず、何も送信しません。いつ閉じても、いつ戻ってきても、また同じように始まります。</p>
  </div>
  <button class="ghost" onclick="go('home')">ホームに戻る</button>
`;

V.open = () => `
  <div class="card">
    <p class="narr">歩道に、背中の曲がった車椅子の男性が止まっている。</p>
  </div>
  <div class="qlabel">どうしますか</div>
  <button class="choice" onclick="goNear()"><span class="act">すこし</span>近づいてみる</button>
  <button class="choice" onclick="go('farpass')"><span class="act">遠まきに</span>通り過ぎる</button>
`;

V.farpass = () => `
  <div class="card">
    <p class="narr">遠まきに、通り過ぎた。彼のことは、何も分からないまま。</p>
  </div>
  ${learn("それも、ふつうの距離です", `
    <p>遠くからでは、困っているのかどうかさえ分かりません。分からないまま行き過ぎる——街では、それがいちばん多いすれちがい方です。</p>
    <p>気になったら、近づいてみる。分かるのは、いつもそこからです。</p>
  `, true)}
  <button class="next" onclick="start()">もう一周してみる</button>
  <button class="ghost" onclick="go('home')">最初の画面へ</button>
  <button class="ghost" onclick="go('backstage')">終了する</button>
`;

V.near = () => {
  if(S.world === "drop"){
    return `
  <div class="card">
    <p class="narr">近づく。よく見ると、車輪のななめ前——手の届かないところに、${S.item.name}が落ちている。彼はそれを、じっと見ている。</p>
  </div>
  <div class="qlabel">どうしますか</div>
  <button class="choice" onclick="pick1('hello')"><span class="act">やや斜め前から</span>「こんにちは」と声をかける</button>
  <button class="choice" onclick="pick1('back')"><span class="act">うしろから</span>「あの、落としましたよ」と声をかける</button>
  <button class="choice" onclick="pick1('front')"><span class="act">やや斜め前にまわりこんで</span>目が合ってから、声をかける</button>
  <button class="choice" onclick="pick1('silent')"><span class="act">何も言わずに</span>${S.item.counter}を拾って、渡す</button>
  <button class="choice" onclick="pick1('pass')"><span class="act">今日は</span>通り過ぎる</button>
`;
  }
  if(S.world === "dansa"){
    return `
  <div class="card">
    <p class="narr">近づく。歩道の先に、数センチの段差がある。彼はその手前で止まって、あたりをゆっくり見回している。人通りは、わりとある。</p>
  </div>
  <div class="qlabel">どうしますか</div>
  <button class="choice" onclick="pickDansa('eye')"><span class="act">視界に入って</span>立ち止まり、目を合わせる</button>
  <button class="choice" onclick="pickDansa('open')"><span class="act">やや斜め前から</span>「何かお手伝いできることありますか？」</button>
  <button class="choice" onclick="pickDansa('push')"><span class="act">何も言わずに</span>うしろから車椅子を押して上げようとする</button>
  <button class="choice" onclick="pickDansa('pass')"><span class="act">今日は</span>通り過ぎる</button>
`;
  }
  if(S.world === "door"){
    return `
  <div class="card">
    <p class="narr">近づく。建物の入り口——引いて開けるタイプの扉の前で、彼は止まっている。あたりに、ほかの人影はない。</p>
    <p class="narr">彼がこちらに気づいた。</p>
  </div>
  ${say("あのー、あのー、すいません。")}
  <div class="qlabel">どうしますか</div>
  <button class="choice" onclick="pickDoor('respond')"><span class="act">立ち止まって</span>「はい、どうしました？」</button>
  <button class="choice" onclick="pickDoor('hello')"><span class="act">目を合わせて</span>「こんにちは。どうされました？」</button>
  <button class="choice" onclick="pickDoor('ignore')"><span class="act">聞こえなかったことにして</span>通り過ぎる</button>
`;
  }
  if(S.world === "taka"){
    return `
  <div class="card">
    <p class="narr">近づく。自動販売機の前で、彼は上の段を見上げたまま止まっている。</p>
  </div>
  <div class="qlabel">どうしますか</div>
  <button class="choice" onclick="pickTaka('hello')"><span class="act">やや斜め前から</span>「こんにちは」と声をかける</button>
  <button class="choice" onclick="pickTaka('open')"><span class="act">やや斜め前から</span>「何かお手伝いできることありますか？」</button>
  <button class="choice" onclick="pickTaka('vague')"><span class="act">ひとこと</span>「大丈夫ですか？」</button>
  <button class="choice" onclick="pickTaka('pass')"><span class="act">今日は</span>通り過ぎる</button>
`;
  }
  return `
  <div class="card">
    <p class="narr">近づく。彼は、スマートフォンをスクロールしたり、辺りを見渡したりしている。困っているのか、いないのか——まだ分からない。</p>
  </div>
  <div class="qlabel">どうしますか</div>
  <button class="choice" onclick="pickPhone('hello')"><span class="act">やや斜め前から</span>「こんにちは」と声をかける</button>
  <button class="choice" onclick="pickPhone('open')"><span class="act">やや斜め前にまわりこんで</span>「何かお手伝いできることありますか？」</button>
  <button class="choice" onclick="pickPhone('vague')"><span class="act">ひとこと</span>「大丈夫ですか？」</button>
  <button class="choice" onclick="pickPhone('pass')"><span class="act">そのまま</span>通り過ぎる</button>
`;
};

V.noreact = () => `
  <div class="card">
    <p class="narr">「あの——落としましたよ」</p>
    <p class="narr">……返事がない。彼は${S.item.name}を見つめたまま、あなたに気づく様子がない。</p>
  </div>
  ${learn("なにが起きたのか", `
    <p>彼の視点は、立っている人の<b>腰のあたりの高さ</b>にある。見えているのは前方およそ160度——<b>その後ろの世界は、存在しないに等しい</b>。うしろからの声は、届かない。</p>
    ${FIG160}
    <p>近づくなら、<b>やや斜め前</b>——右でも左でもいい。車椅子は前後に動く可能性が常にあって、真後ろの至近距離に立つと、轢かれることすらあり得ます。でも、左右に急に動くことは絶対にない。だから斜め前がいちばん安心です（絶対の義務では、全然ないけれど）。</p>
    <p>そしてここが大事なところ——気づかないことに、<b>無視も悪気もない</b>。視界に入って、目が合ったら。そこからがコミュニケーションのスタートです。</p>
  `, true)}
  <button class="next" onclick="go('front')">斜め前にまわりこむ</button>
`;

/* ---------- α1 読み上げ（v0.10・ブラウザ内蔵TTS／資材ゼロ） ---------- */
const TTS_SUPPORTED = (typeof speechSynthesis !== "undefined") && (typeof SpeechSynthesisUtterance !== "undefined");
let ttsOn = false, ttsList = [], ttsIdx = 0, ttsVoice = null;

/* 読み仮名辞書（共通層）: 表示は変えず、読み上げ直前にのみ置換。誤読が見つかったらここに追加すると全箱に恒久継承される */
const TTS_DICT = [
  ["あ——すいません", "あー、すいません"],  /* [仮] 耳判断待ち */
  ["3階に降ります", "3階におります"]  /* 読み指定（2026-08-21 SR検収11: 「ふります」誤読の修正） */,
  ["」には", "」、には"]  /* 2026-08-25 SR検収1: 引用の閉じ「」」と後続助詞の間に一拍 */,
  ["箱2", "はこに"]  /* 2026-08-25 SR検収2: 「ばこ」誤読の修正 */,
  ["4階・お席", "4階、おせき"]  /* 2026-08-25 SR検収3: 中黒の間と「お席」のイントネーション */,
  ["ならんで残る", "並んで残る"]  /* 2026-08-25 SR検収4: 「ならんで」のイントネーション */
];
const TTS_PAUSE_MS = 600;  /* 「——」に割り当てる無音の長さ */
function ttsApplyDict(t){
  for(const pair of TTS_DICT){ t = t.split(pair[0]).join(pair[1]); }
  /* シーン番号の読み（2026-08-21 SR検収2・3）: 番号のあとに間を置き、第二部の「'」を「ダッシュ」と発音 */
  t = t.replace(/S(\d)' /g, "エス$1ダッシュ。 ");
  t = t.replace(/S(\d) /g, "エス$1。 ");
  t = t.replace(/S(\d)'/g, "エス$1ダッシュ");
  t = t.replace(/S(\d)/g, "エス$1");
  t = t.split("」と").join("」、と");  /* 引用の閉じと地の文の間に一拍（表示不変） */
  return t;
}

function ttsPickVoice(){
  if(!TTS_SUPPORTED) return;
  const ja = speechSynthesis.getVoices().filter(function(v){ return (v.lang || "").toLowerCase().indexOf("ja") === 0; });
  ttsVoice = ja.find(function(v){ return /google/i.test(v.name); }) || ja[0] || null;
}

function ttsParts(){
  const clone = stage.cloneNode(true);
  clone.querySelectorAll('[role="img"]').forEach(function(el){
    const p = document.createElement("p");
    p.className = "narr";
    p.textContent = "図の説明。" + (el.getAttribute("aria-label") || "");
    el.parentNode.replaceChild(p, el);
  });
  const parts = [];
  clone.querySelectorAll(".eyebrow,h1,h2,.sub,.sn,.meta,.narr,.say .who,.say .line,.qlabel,.learnhead .t,.learn p,.grad,.beat,.about p,.about li,button").forEach(function(el){
    const t = el.textContent.replace(/\s+/g, " ").trim();
    if(t) parts.push(t);
  });
  if(!parts.length) parts.push(clone.textContent.replace(/\s+/g, " ").trim());
  return parts;
}

function ttsText(){
  return ttsParts().join("。 ").replace(/。{2,}/g, "。");
}

function ttsChunks(text){
  const out = [];
  let buf = "";
  for(const ch of text){
    if(ch === "—"){
      if(buf.trim()) out.push(buf.trim());
      if(out[out.length - 1] !== "\u0000") out.push("\u0000");  /* 実無音マーカー */
      buf = "";
      continue;
    }
    buf += ch;
    if(ch === "。" || ch === "！" || ch === "？"){
      if(buf.trim()) out.push(buf.trim());
      buf = "";
    } else if(buf.length >= 90){
      const cut = buf.lastIndexOf("、");
      if(cut > 30){ out.push(buf.slice(0, cut + 1).trim()); buf = buf.slice(cut + 1); }
      else { out.push(buf.trim()); buf = ""; }
    }
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}

function ttsSetOn(on){
  ttsOn = on;
  const b = document.getElementById("ttsbtn");
  if(!b) return;
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.textContent = on ? "⏹ 停止" : "🔊 読み上げ";
  b.setAttribute("aria-label", on ? "読み上げを停止する" : "この画面を読み上げる");
}

function ttsSpeakNext(){
  if(!ttsOn || ttsIdx >= ttsList.length){ ttsSetOn(false); return; }
  const piece = ttsList[ttsIdx++];
  if(piece === "\u0000"){ setTimeout(ttsSpeakNext, TTS_PAUSE_MS); return; }
  const u = new SpeechSynthesisUtterance(piece);
  u.lang = "ja-JP";
  if(ttsVoice) u.voice = ttsVoice;
  u.rate = 1;
  u.onend = ttsSpeakNext;
  u.onerror = function(){ ttsSetOn(false); };
  speechSynthesis.speak(u);
}

function ttsStart(){
  if(!TTS_SUPPORTED) return;
  ttsList = ttsChunks(ttsApplyDict(ttsText()));
  ttsIdx = 0;
  if(!ttsList.length) return;
  speechSynthesis.cancel();
  ttsSetOn(true);
  setTimeout(ttsSpeakNext, 60);
}

function ttsStop(){
  if(!TTS_SUPPORTED){ return; }
  ttsOn = false;
  speechSynthesis.cancel();
  ttsSetOn(false);
}

(function(){
  const b = document.getElementById("ttsbtn");
  if(!b) return;
  if(!TTS_SUPPORTED){ b.style.display = "none"; return; }
  b.addEventListener("click", function(){ if(ttsOn){ ttsStop(); } else { ttsStart(); } });
  ttsPickVoice();
  if(speechSynthesis.onvoiceschanged !== undefined){
    speechSynthesis.addEventListener("voiceschanged", ttsPickVoice);
  }
})();

    close = `<p class="narr">係は一礼して、持ち場へ戻っていった。帰りのことは、まだだれも知らない。</p>`;
  }
  return `
  <div class="scenebox"><p class="eyebrow">4階・お席</p><h2>S4' 受け取りと席</h2></div>

  ${seat}

  `;
};

V.p2s5 = () => {

/* ---------- 検収モード（#kenshu）: 全文言の一括読み上げ点検。URL末尾に#kenshuを付けた時のみ起動、通常プレイヤーには不可視 ---------- */
let KQ = null;

function kenshuFlag(t){
  return /[0-90-9A-Za-zA-Za-z%%##**→←〜※]/.test(t) || /その方|の方が|開い|開け|行って/.test(t);
}

function kenshuHarvest(seen, out){
  ttsParts().forEach(function(t){
    t = t.replace(/\s+/g, " ").trim();
    if(t && !seen.has(t)){ seen.add(t); out.push(t); }
  });
}

function kenshuCorpus(){
  const seen = new Set(); const out = [];
  const origRandom = Math.random;
  const saveApproach = approachCount;
  const saveB2 = B2, saveB2p = b2Played, saveP2 = b2p2Played;
  try{
    go("home"); kenshuHarvest(seen, out);
    go("exitlite"); kenshuHarvest(seen, out);
    start(); go("farpass"); kenshuHarvest(seen, out);
    const plan = [
      [0.1, "drop",  ["hello","back","front","silent","pass"]],
      [0.4, "dansa", ["eye","open","push","pass"]],
      [0.6, "door",  ["respond","hello","ignore"]],
      [0.8, "taka",  ["hello","open","vague","pass"]],
      [0.9, "phone", ["hello","open","vague","pass"]]
    ];
    for(const w of plan){
      const rig = function(){ return w[0]; };
      Math.random = rig; approachCount = 0;
      start(); goNear(); kenshuHarvest(seen, out);
      for(const c of w[2]){
        Math.random = rig; approachCount = 0;
        start(); goNear();
        if(w[1] === "drop") pick1(c);
        else if(w[1] === "dansa") pickDansa(c);
        else if(w[1] === "door") pickDoor(c);
        else if(w[1] === "taka") pickTaka(c);
        else pickPhone(c);
        kenshuHarvest(seen, out);
      }
      if(w[1] === "drop"){
        for(const v of ["open","direct","vague"]){
          Math.random = rig; approachCount = 0;
          start(); goNear(); pick1("front"); pick2(v); kenshuHarvest(seen, out);
        }
      }
      if(w[1] === "phone"){
        for(const c of ["hello","open","vague"]){
          Math.random = rig; approachCount = 10;
          start(); goNear(); pickPhone(c); kenshuHarvest(seen, out);
        }
      }
    }
    b2Start(); kenshuHarvest(seen, out);
    for(const c of ["tsure","tachi","kagamu","kami"]){ b2Start(); b2s1(c); kenshuHarvest(seen, out); }
    b2Start(); b2s1("kagamu"); b2s1b("return"); kenshuHarvest(seen, out);
    b2Start(); b2s1("kagamu"); b2s1b("keep"); kenshuHarvest(seen, out);
    render(V.b2s2()); kenshuHarvest(seen, out);
    b2s2("sengen"); kenshuHarvest(seen, out);
    b2s2("yohi"); kenshuHarvest(seen, out);
    for(const c of ["matte","fukusho","manual"]){ render(V.b2s2()); b2s2("sengen"); b2s2b(c); kenshuHarvest(seen, out); }
    render(V.b2s3()); kenshuHarvest(seen, out);
    for(const c of ["marunage","hikitsugi","ikki"]){ render(V.b2s3()); b2s3(c); kenshuHarvest(seen, out); }
    render(V.b2s4()); kenshuHarvest(seen, out);
    for(const c of ["sakura","kuukyo","souten","shikaku"]){ render(V.b2s4()); b2s4(c); kenshuHarvest(seen, out); }
    /* 第二部: 既定ルート＋ミラー全変種を網羅する4セット */
    const p2sets = [
      {},
      {s1:"tsure",  s1b:"return", s2:"yohi",   s2b:"fukusho", s3:"hikitsugi", s4:"souten"},
      {s1:"kagamu", s1b:"keep",   s2:"sengen", s2b:"matte",   s3:"ikki",      s4:"shikaku"},
      {s1:"tachi",                s2:"sengen", s2b:"manual",  s3:"marunage",  s4:"kuukyo"},
      {s1:"kami",                                                             s4:"sakura"}
    ];
    for(const st of p2sets){
      B2 = Object.assign({}, st);
      render(V.p2s1()); kenshuHarvest(seen, out);
      render(V.p2s2()); kenshuHarvest(seen, out);
      if(B2.s2 === "yohi"){ p2s2go("ok"); kenshuHarvest(seen, out); }
      else {
        p2s2go("refuse"); kenshuHarvest(seen, out);
        render(V.p2s2()); p2s2go("follow"); kenshuHarvest(seen, out);
      }
      render(V.p2s3()); kenshuHarvest(seen, out);
      p2s3("self"); kenshuHarvest(seen, out);
      render(V.p2s3()); p2s3("makase"); kenshuHarvest(seen, out);
      render(V.p2s4()); kenshuHarvest(seen, out);
      render(V.p2s5()); kenshuHarvest(seen, out);
      render(V.p2s6()); kenshuHarvest(seen, out);
    }
    go("debrief"); kenshuHarvest(seen, out);
    go("backstage"); kenshuHarvest(seen, out);
    go("about"); kenshuHarvest(seen, out);
  } finally {
    Math.random = origRandom;
    approachCount = saveApproach;
    B2 = saveB2; b2Played = saveB2p; b2p2Played = saveP2;
  }
  return out;
}

function kenshuSpeakLine(t){
  const chunks = ttsChunks(ttsApplyDict(t));
  let ci = 0;
  function nextChunk(){
    if(!KQ || !KQ.playing) return;
    if(ci >= chunks.length){ kenshuNext(); return; }
    const piece = chunks[ci++];
    if(piece === "\u0000"){ setTimeout(nextChunk, TTS_PAUSE_MS); return; }
    const u = new SpeechSynthesisUtterance(piece);
    u.lang = "ja-JP"; if(ttsVoice) u.voice = ttsVoice; u.rate = KQ.rate;
    u.onend = nextChunk;
    u.onerror = function(){ if(KQ) KQ.playing = false; };
    speechSynthesis.speak(u);
  }
  nextChunk();
}

function kenshuNext(){
  if(!KQ || !KQ.playing) return;
  do { KQ.idx++; } while(KQ.idx < KQ.lines.length && KQ.onlyFlagged && !kenshuFlag(KQ.lines[KQ.idx]));
  if(KQ.idx >= KQ.lines.length){
    KQ.playing = false;
    kenshuStatus("終わりです。下の疑義リストをコピーして送ってください（0件ならその旨だけで）。");
    return;
  }
  const t = KQ.lines[KQ.idx];
  const line = document.getElementById("kline");
  const prog = document.getElementById("kprog");
  if(line) line.textContent = t;
  if(prog) prog.textContent = (KQ.idx + 1) + " / " + KQ.lines.length + (kenshuFlag(t) ? "　⚑要注意" : "");
  kenshuSpeakLine(t);
}

function kenshuPlay(fromTop){
  if(!KQ) return;
  if(!TTS_SUPPORTED){ kenshuStatus("この環境は読み上げ非対応です。"); return; }
  speechSynthesis.cancel();
  if(fromTop) KQ.idx = -1;
  KQ.playing = true;
  setTimeout(kenshuNext, 60);
}

function kenshuPause(){
  if(!KQ) return;
  if(KQ.playing){
    KQ.playing = false;
    if(TTS_SUPPORTED) speechSynthesis.cancel();
    kenshuStatus("一時停止中。");
  } else {
    KQ.idx--;
    kenshuStatus("");
    kenshuPlay(false);
  }
}

function kenshuMark(){
  if(!KQ || KQ.idx < 0 || KQ.idx >= KQ.lines.length) return;
  const t = KQ.lines[KQ.idx];
  if(KQ.marks.indexOf(t) === -1) KQ.marks.push(t);
  const ta = document.getElementById("kmarks");
  if(ta) ta.value = KQ.marks.map(function(m, i){ return (i + 1) + ". " + m; }).join("\n");
  kenshuStatus("旗を立てました（" + KQ.marks.length + "件）。");
}

function kenshuRate(r){ if(KQ) KQ.rate = r; kenshuStatus("速さ " + r + " に変更。"); }

function kenshuOnly(btn){
  if(!KQ) return;
  KQ.onlyFlagged = !KQ.onlyFlagged;
  if(btn) btn.textContent = "⚑要注意のみ: " + (KQ.onlyFlagged ? "ON" : "OFF");
}

function kenshuCopy(){
  const ta = document.getElementById("kmarks");
  if(!ta) return;
  ta.focus(); ta.select();
  try { document.execCommand("copy"); kenshuStatus("コピーしました。そのままClaudeに貼ってください。"); }
  catch(e){ kenshuStatus("選択済みです。手動でコピーしてください。"); }
}

function kenshuStatus(m){
  const el = document.getElementById("kstat");
  if(el) el.textContent = m;
}

function kenshuView(){
  const total = KQ.lines.length;
  let flagged = 0;
  for(const t of KQ.lines){ if(kenshuFlag(t)) flagged++; }
  const b = 'style="width:auto;display:inline-block;min-height:42px;padding:8px 12px;margin:2px 4px 2px 0"';
  return `
  <div class="card">
    <p class="eyebrow">検収モード（開発用）</p>
    <p class="narr">アプリ内の全文言 <b>${total}行</b>（うち ⚑要注意 <b>${flagged}行</b>）を上から順に読み上げます。変な読みが聞こえたら「⚠この行に旗」。最後にリストをコピーして送るだけで検収完了です。ここは通常のプレイヤーには見えません。</p>
    <p>
      <button class="ghost" ${b} onclick="kenshuPlay(true)">▶ 最初から再生</button>
      <button class="ghost" ${b} onclick="kenshuPause()">⏯ 一時停止／再開</button>
      <button class="ghost" ${b} onclick="kenshuMark()">⚠ この行に旗</button>
    </p>
    <p>
      <button class="ghost" ${b} onclick="kenshuRate(1.0)">速さ1.0</button>
      <button class="ghost" ${b} onclick="kenshuRate(1.3)">1.3</button>
      <button class="ghost" ${b} onclick="kenshuRate(1.6)">1.6</button>
      <button class="ghost" ${b} onclick="kenshuOnly(this)">⚑要注意のみ: OFF</button>
    </p>
    <p class="sn" id="kprog">未再生</p>
    <p class="narr" id="kline" style="min-height:3em">—</p>
    <p class="sn" id="kstat"></p>
    <p class="sn">疑義リスト:　<button class="ghost" ${b} onclick="kenshuCopy()">リストをコピー</button></p>
    <textarea id="kmarks" readonly style="width:100%;min-height:8em;font-size:.9rem;box-sizing:border-box"></textarea>
  </div>
  <button class="ghost" onclick="ttsStop(); go('home')">ホームに戻る</button>`;
}

function kenshuStart(){
  KQ = { lines: kenshuCorpus(), idx: -1, playing: false, rate: 1.0, onlyFlagged: false, marks: [] };
  render(kenshuView());
}

/* ---------- 隠し扉（v0.22で追加）: フッターの版番号を5回連続タップで検収モードへ ----------
   Android等、アドレスバーに #kenshu を打ち込めない環境のための代替入口。
   間隔が3秒空いたらカウントはリセット。通常プレイヤーには見えず、文言・見た目にも不干渉。 */
const KENSHU_TAPS = 5;
const KENSHU_TAP_GAP_MS = 3000;
let kenshuTapCount = 0, kenshuTapLast = 0;
(function(){
  const el = document.getElementById("verstamp");
  if(!el) return;
  el.addEventListener("click", function(){
    const now = Date.now();
    kenshuTapCount = (now - kenshuTapLast > KENSHU_TAP_GAP_MS) ? 1 : (kenshuTapCount + 1);
    kenshuTapLast = now;
    if(kenshuTapCount >= KENSHU_TAPS){
      kenshuTapCount = 0;
      kenshuStart();
    }
  });
})();

window.addEventListener("hashchange", function(){ if(location.hash === "#kenshu"){ kenshuStart(); } });
if(location.hash === "#kenshu"){ kenshuStart(); } else { go("home"); }
</script>
